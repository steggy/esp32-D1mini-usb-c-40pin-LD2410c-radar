# Copy this file to secrets.yaml before compiling radar.yaml.
# Replace every placeholder with a unique value.
#
# Never commit or share the completed secrets.yaml file.
# Use different API and OTA credentials for every physical device.
#
# Home Wi-Fi credentials are not stored here. Wi-Fi is provided later
# through the setup access point, Bluetooth, or USB provisioning.

# ESPHome API encryption key:
# Must be a newly generated 32-byte Base64 key.
api_encryption_key: "REPLACE_WITH_A_UNIQUE_32_BYTE_BASE64_KEY"

# Password protecting over-the-air firmware updates.
ota_password: "REPLACE_WITH_A_UNIQUE_STRONG_OTA_PASSWORD"

# Password for the temporary "Radar Setup" Wi-Fi access point.
# Must contain at least 8 characters.
setup_ap_password: "REPLACE_WITH_A_UNIQUE_SETUP_PASSWORD"
